<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submit a Page</title>
  <link rel="stylesheet" href="https://unpkg.com/pell/dist/pell.min.css">
  <style>
    body { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    input, button { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
    .pell-content { height: 250px; }
    .pell { margin-bottom: 15px; }
  </style>
</head>
<body>

  <h2>Submit a Page</h2>
  <input type="text" id="title" placeholder="Page Title" />
  <div id="editor" class="pell"></div>
  <button id="btn" onclick="submitPage()">Go!</button>
  <script src="https://unpkg.com/pell"></script>
  <script>
    let htmlContent = '';
    const editor = pell.init({
      element: document.getElementById('editor'),
      onChange: html => { htmlContent = html; },
      actions: [
        'bold', 'italic', 'underline', 'strikethrough',
        'heading1', 'heading2',
        'olist', 'ulist', 'link'
      ]
    });
    const worker = "https://horde.aomeix.workers.dev";
    async function submitPage() {
      const title = document.getElementById('title').value.trim();
      const btn = document.getElementById('btn');

      if (!title || !htmlContent.trim()) {
        alert('One or more of the required fields were empty!');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Submitting...";

      try {
        const res = await fetch(worker, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content: htmlContent })
        });

        if (res.ok) {
          const slug = title.slice(0, 150).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80);
          const pageUrl = `https://aomeix.github.io/owotarchive/${slug}`;
          alert(`Submission sent! Your page will be at ${pageUrl} if it gets accepted`);
          document.getElementById('title').value = '';
          editor.content.innerHTML = '';
          htmlContent = '';
        } else {
          alert('Failed to submit...');
        }
      } catch (err) {
        alert('Failed to submit...');
      } finally {
        btn.disabled = false;
        btn.innerText = "Go!";
      }
    }
  </script>
</body>
</html>
